name: NFL model

on:
  pull_request:
    paths:
      - "nfl-model/**"
      - ".github/workflows/nfl-model.yml"
  push:
    paths:
      - "nfl-model/**"
      - ".github/workflows/nfl-model.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfl-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
