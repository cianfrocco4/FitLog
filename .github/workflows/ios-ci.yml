# Compile + unit-test FitLog on every PR / push to main.
# This is the merge gate when Cursor automations can't use a Mac/Xcode worker.
name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -project FitLog.xcodeproj -scheme FitLog -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | head -30 || true

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FitLog.xcodeproj \
            -scheme FitLog

      - name: Pick iPhone simulator destination
        id: dest
        run: |
          set -euo pipefail
          # Prefer destinations xcodebuild itself accepts (more reliable than simctl name parsing).
          DESTINATIONS=$(xcodebuild -project FitLog.xcodeproj -scheme FitLog -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | grep -v 'name:Any' || true)

          pick() {
            local pattern="$1"
            echo "$DESTINATIONS" | grep -F "$pattern" | head -1 || true
          }

          LINE=""
          for pattern in \
            'name:iPhone 17 Pro,' \
            'name:iPhone 16 Pro,' \
            'name:iPhone 17,' \
            'name:iPhone 16,' \
            'name:iPhone'
          do
            LINE=$(pick "$pattern")
            if [ -n "$LINE" ]; then
              break
            fi
          done

          if [ -z "$LINE" ]; then
            echo "No iPhone simulator destination from xcodebuild -showdestinations" >&2
            echo "$DESTINATIONS" >&2
            exit 1
          fi

          ID=$(echo "$LINE" | sed -E 's/.*id:([^,}]+).*/\1/' | tr -d ' ')
          NAME=$(echo "$LINE" | sed -E 's/.*name:([^}]+).*/\1/' | sed 's/,.*//' | sed 's/[[:space:]]*$//')

          if [ -z "$ID" ]; then
            echo "Failed to parse simulator id from: $LINE" >&2
            exit 1
          fi

          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME ($ID)"
          echo "line=$LINE"

      - name: Build for simulator
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild build \
            -project FitLog.xcodeproj \
            -scheme FitLog \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.dest.outputs.id }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run unit tests
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project FitLog.xcodeproj \
            -scheme FitLog \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.dest.outputs.id }}" \
            -only-testing:FitLogTests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
