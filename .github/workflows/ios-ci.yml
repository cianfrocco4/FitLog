# Compile + unit-test FitLog on every PR / push to main.
# This is the merge gate when Cursor automations can't use a Mac/Xcode worker.
name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs. Do not cancel push/dispatch on main — a stray
  # workflow_dispatch cancelled the living-users merge CI (Actions run #86).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          echo "--- simctl devices ---"
          xcrun simctl list devices available | head -60 || true
          echo "--- runtimes ---"
          xcrun simctl list runtimes | head -40 || true

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FitLog.xcodeproj \
            -scheme FitLog

      # Build does not need a concrete simulator UDID.
      - name: Build for simulator
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild build \
            -project FitLog.xcodeproj \
            -scheme FitLog \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Tests need a concrete booted/available simulator. Resolve by UDID via simctl JSON.
      - name: Pick test simulator
        id: dest
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys

          def run(cmd):
              return subprocess.check_output(cmd, text=True)

          data = json.loads(run(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          devices = []
          for runtime, items in data.get("devices", {}).items():
              if "iOS" not in runtime and "iphonesimulator" not in runtime.lower():
                  # Still include; keys look like "com.apple.CoreSimulator.SimRuntime.iOS-18-5"
                  pass
              for d in items:
                  if d.get("isAvailable") is False:
                      continue
                  name = d.get("name") or ""
                  if not name.startswith("iPhone"):
                      continue
                  devices.append((name, d["udid"], runtime))

          if not devices:
              print("No available iPhone simulators from simctl:", file=sys.stderr)
              print(run(["xcrun", "simctl", "list", "devices", "available"]), file=sys.stderr)
              sys.exit(1)

          preferred = [
              "iPhone 16",
              "iPhone 16 Pro",
              "iPhone 15",
              "iPhone 15 Pro",
              "iPhone 17",
              "iPhone 17 Pro",
              "iPhone SE",
          ]

          def rank(item):
              name, udid, runtime = item
              for i, pref in enumerate(preferred):
                  if name == pref or name.startswith(pref + " "):
                      return (i, name)
              return (len(preferred), name)

          name, udid, runtime = sorted(devices, key=rank)[0]
          print(f"Using simulator: {name} ({udid}) runtime={runtime}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"id={udid}\n")
              fh.write(f"name={name}\n")
          PY

      - name: Run unit tests
        run: |
          set -euo pipefail
          set -o pipefail
          # Boot helps avoid flaky "failed to find destination" / bootstrap crashes.
          xcrun simctl boot "${{ steps.dest.outputs.id }}" 2>/dev/null || true
          xcrun simctl bootstatus "${{ steps.dest.outputs.id }}" -b || true

          xcodebuild test \
            -project FitLog.xcodeproj \
            -scheme FitLog \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.dest.outputs.id }}" \
            -only-testing:FitLogTests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          # FitLogUITests stay on the Mac worker (fitlog-mac). See docs/AUTOMATED_USER_TESTING.md.
